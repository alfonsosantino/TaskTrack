<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task • TaskTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="main">
    <section class="page-head">
      <h1 id="page-title">Add Task</h1>
      <p>A simple form keeps task creation fast.</p>
    </section>

    <form class="card accent form-card" id="task-form" novalidate>
      <h2 id="form-title">Create New Task</h2>

      <div class="form-row">
        <label class="lbl" for="name">Task Name:</label>
        <input type="text" id="name" name="name" maxlength="80" placeholder="e.g. Database Assignment" required>
      </div>
      <div class="error-msg">Please enter a task name.</div>

      <div class="form-row">
        <label class="lbl" for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" maxlength="60" list="subject-list" placeholder="e.g. Database Systems" required>
        <datalist id="subject-list"></datalist>
      </div>
      <div class="error-msg">Please enter the subject.</div>

      <div class="form-row">
        <label class="lbl" for="type">Task Type:</label>
        <select id="type" name="type">
          <option>Assignment</option>
          <option>Project</option>
          <option>Quiz</option>
          <option>Exam</option>
          <option>Report</option>
          <option>Reading</option>
          <option>Activity</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-row">
        <label class="lbl" for="due">Due Date:</label>
        <input type="date" id="due" name="due" required>
      </div>
      <div class="error-msg">Please choose a due date.</div>

      <div class="form-row">
        <span class="lbl" id="priority-lbl">Priority:</span>
        <div class="radio-group" role="radiogroup" aria-labelledby="priority-lbl">
          <label><input type="radio" name="priority" value="high"> <span class="dot high"></span> High</label>
          <label><input type="radio" name="priority" value="medium" checked> <span class="dot medium"></span> Medium</label>
          <label><input type="radio" name="priority" value="low"> <span class="dot low"></span> Low</label>
        </div>
      </div>

      <div class="form-row" id="status-row">
        <label class="lbl" for="status">Status:</label>
        <select id="status" name="status">
          <option value="todo">To Do</option>
          <option value="progress">In Progress</option>
          <option value="done">Completed</option>
        </select>
      </div>

      <div class="form-row top">
        <label class="lbl" for="description">Description:</label>
        <textarea id="description" name="description" maxlength="400" placeholder="Optional notes, instructions, or links…"></textarea>
      </div>

      <div class="form-actions">
        <a class="btn ghost" href="index.html">CANCEL</a>
        <button type="submit" class="btn" id="save-btn">SAVE TASK</button>
      </div>
    </form>
  </main>

  <script src="js/app.js"></script>
  <script src="js/add-task.js"></script>
</body>
</html>
