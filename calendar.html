<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar • TaskTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="main">
    <section class="page-head">
      <h1>Calendar</h1>
      <p>See deadlines by day and identify busy periods.</p>
    </section>

    <div class="cal-head">
      <button class="icon-btn" id="prev" aria-label="Previous month"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2 id="month-label">Month</h2>
      <button class="icon-btn" id="next" aria-label="Next month"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn ghost small" id="today-btn">TODAY</button>
    </div>

    <div class="cal-grid" id="dow-row">
      <div class="cal-dow">MON</div><div class="cal-dow">TUE</div><div class="cal-dow">WED</div>
      <div class="cal-dow">THU</div><div class="cal-dow">FRI</div><div class="cal-dow">SAT</div><div class="cal-dow">SUN</div>
    </div>
    <div class="cal-grid" id="cal-grid" style="margin-top:8px"></div>

    <div class="cal-legend">
      <span><i class="dot high"></i> High</span>
      <span><i class="dot medium"></i> Medium</span>
      <span><i class="dot low"></i> Low</span>
      <span><i class="dot" style="background:#fff7ef;border:1px solid #f6c48f"></i> Busy day (3+ tasks)</span>
    </div>

    <section class="card accent day-panel" aria-live="polite">
      <h3 id="day-title">Selected day</h3>
      <div class="task-list" id="day-list"></div>
      <div style="text-align:center;margin-top:16px">
        <a class="btn" id="add-on-day" href="add-task.html">ADD TASK ON THIS DAY</a>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
